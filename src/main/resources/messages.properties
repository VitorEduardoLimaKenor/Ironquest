# ---------- Mensagens gerais ----------
mensagem.invalida=Mensagem inválida
mensagem.corpo-ausente=O corpo da requisição é obrigatório
mensagem.atributo-desconhecido=O atributo ''{0}'' não é reconhecido
mensagem.valor-invalido=Valor inválido para o atributo ''{0}''
dados.invalidos=Um ou mais campos são inválidos
parametro.tipo-invalido=Valor ''{1}'' inválido para o parâmetro ''{0}''
recurso.nao-encontrado={0} de id {1} não encontrado(a)
