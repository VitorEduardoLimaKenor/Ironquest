# ---------- Bean Validation ({0} = rótulo do campo) ----------
NotBlank={0} é obrigatório(a)
NotNull={0} é obrigatório(a)
NotEmpty={0} deve ter ao menos um item
Size={0} deve ter no máximo {1} caracteres
Size.criarUsuarioRequest.senha={0} deve ter entre {2} e {1} caracteres
Size.planoTreinoRequest.itens=O plano pode ter no máximo {1} exercícios
Email={0} deve ser um e-mail válido
Min={0} deve ser maior ou igual a {1}
Max={0} deve ser menor ou igual a {1}
DecimalMin={0} deve ser maior ou igual a {2}
DecimalMax={0} deve ser menor ou igual a {2}
Digits={0} deve ter no máximo {2} dígitos inteiros e {1} decimais
Pattern={0} está em formato inválido
Pattern.conquistaRequest.codigo={0} deve conter apenas letras maiúsculas, dígitos e _
PastOrPresent={0} não pode estar no futuro
AssertTrue.sessaoTreinoFilter.periodoValido=A data inicial deve ser anterior ou igual à data final
typeMismatch=Valor inválido para {0}

