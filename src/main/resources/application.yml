spring:
  application:
    name: ironquest-api
  datasource:
    # Ajuste via variáveis de ambiente ou edite os valores padrão para o seu MySQL local.
    url: ${DB_URL:jdbc:mysql://localhost:3306/ironquest?createDatabaseIfNotExist=true&connectionTimeZone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é responsabilidade do Flyway; o Hibernate apenas valida o mapeamento.
      ddl-auto: validate
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Atributo desconhecido no JSON gera 400 em vez de ser ignorado.
      fail-on-unknown-properties: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
        # Página serializada como {"content": [...], "page": {...}}.
        serialization-mode: via-dto

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

ironquest:
  cors:
    # Frontend Angular (ng serve) em desenvolvimento.
    origens-permitidas: ${CORS_ORIGENS:http://localhost:4200}
  # Fuso usado para definir a data do treino (dataTreino) a partir do instante de início.
  fuso-horario: ${FUSO_HORARIO:America/Sao_Paulo}
  erros:
    # Inclui mensagemDesenvolvedor nas respostas de erro. Desligue em produção.
    expor-detalhes: ${ERROS_EXPOR_DETALHES:true}
